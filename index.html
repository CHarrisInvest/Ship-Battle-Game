<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the sea run edge to edge, under a phone's notch and home bar; the
         HUD and the menus keep clear of them with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Sternchase</title>
    <!-- Full screen on a phone: iPhone Safari cannot be asked to hide its address bar and tabs,
         but a page saved to the home screen opens without them. These say the game is such a page.
         The manifest does the same for Android and desktop Chrome, and the touch icon is what iOS
         puts on the home screen; `npm run icon` redraws it with the menu's own renderer. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sternchase" />
    <!-- the menu's ground, for the first paint; the game moves it to the sea while a round runs -->
    <meta name="theme-color" content="#0f3b39" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- What a search result or a shared link shows. A link preview needs the card's full address,
         so these name the Pages site outright; `npm run icon` draws the card with the icons. -->
    <meta name="description" content="Sternchase: Helm & Hull. An age-of-sail combat game. Fit out a ship in the yard, then fight her broadside to broadside." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sternchase: Helm & Hull" />
    <meta property="og:description" content="An age-of-sail combat game. Fit out a ship in the yard, then fight her broadside to broadside." />
    <meta property="og:url" content="https://sternchase.org/" />
    <meta property="og:image" content="https://sternchase.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Proves to AdSense that the site is ours. It loads nothing: the ad script itself is never
         put here, because it would run before the cookie prompt is answered. It loads from code,
         behind isAdvertisingAllowed in src/consent.js. -->
    <meta name="google-adsense-account" content="ca-pub-1929910138338917" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
