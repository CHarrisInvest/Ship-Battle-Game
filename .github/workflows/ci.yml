name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # the engine imports nothing it must not and never reads the page, the clock or Math.random
      - run: npm run purity
      # every mode played to its end in plain Node, twice from one seed, with no browser
      - run: npm run sim-test
      - run: npm run build
