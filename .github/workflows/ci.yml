name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the engine imports nothing it must not and never reads the page, the clock or Math.random
      - run: npm run purity
      # every mode played to its end in plain Node, twice from one seed, with no browser
      - run: npm run sim-test
      # the hold's rules, pure, and the browser's store on them
      - run: npm run hold-test
      # the exact maths agree with the built-in ones they replace
      - run: npm run exact-test
      # every round ends on the same bits in Chromium, WebKit and Firefox as in Node, which is what
      # lets the server replay a voyage
      - run: npx playwright-core install --with-deps chromium-headless-shell webkit firefox
      - run: npm run determinism
      - run: npm run build

  # the game server against a real Postgres: guests, the hold, and voyages replayed
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run server-test
      - run: npm run client-test
      - run: npm run online-test
