name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # the engine imports nothing it must not and never reads the page, the clock or Math.random
      - run: npm run purity
      # every mode played to its end in plain Node, twice from one seed, with no browser
      - run: npm run sim-test
      # the exact maths agree with the built-in ones they replace
      - run: npm run exact-test
      # every round ends on the same bits in Chromium, WebKit and Firefox as in Node, which is what
      # lets the server replay a voyage
      - run: npx playwright-core install --with-deps chromium-headless-shell webkit firefox
      - run: npm run determinism
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
